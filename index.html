<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#001a33" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>مؤسسة الغويري للتخليص الجمركي - المنظومة السيادية</title>
    <script>
      (function() {
        try {
          const db = localStorage.getItem('alghwairy_db');
          // Check if DB is truly empty or just initialized with defaults
          if (!db || db === '{}' || db === '[]' || (JSON.parse(db).customers?.length === 0 && JSON.parse(db).invoices?.length === 0)) {
            console.log('[Sovereign] Database appears empty. Attempting auto-restore...');
            fetch('/restore_db.json')
              .then(res => {
                if (!res.ok) return;
                return res.json();
              })
              .then(data => {
                if (data && (data.version || data.customers)) {
                  localStorage.setItem('alghwairy_db', JSON.stringify(data));
                  console.log('[Sovereign] Data restored from local backup. Refreshing page...');
                  window.location.reload();
                }
              })
              .catch(e => console.error('[Sovereign] Restore failed:', e));
          }
        } catch (e) {
          console.warn('[Sovereign] Storage check failed:', e);
        }
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
